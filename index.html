<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carlos Bazaga – AI Engineer Portfolio</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <header>
        <div class="top-controls">
            <div class="lang-switch">
                <button data-lang="es">ES</button>
                <button data-lang="en">EN</button>
            </div>

            <button id="theme-toggle" class="theme-toggle">🌓</button>
        </div>
        <div class="container">
            <h1 data-i18n="hero.name"></h1>
            <p data-i18n="hero.subtitle"></p>

            <nav>
                <a href="#about" data-i18n="nav.about"></a>
                <a href="#chatbot" data-i18n="nav.chatbot"></a>
                <a href="#certs" data-i18n="nav.certs"></a>
                <a href="#contact" data-i18n="nav.links"></a>
            </nav>
        </div>
    </header>

    <!-- ABOUT -->
    <section id="about" class="section">
        <div class="container">
            <h2 data-i18n="about.title"></h2>
            <p data-i18n="about.body"></p>
            <div class="about-links">
                <ul>
                    <li><a href="https://github.com/Carbaz" target="_blank">GitHub</a></li>
                    <li><a href="https://www.linkedin.com/in/carlosbazaga" target="_blank">LinkedIn</a></li>
                    <li><a href="mailto:cabazaga@gmail.com">Email</a></li>
                    <li><a href="https://twitter.com/tuusuario" target="_blank">Twitter</a></li>
                </ul>
            </div>
        </div>
    </section>

    <!-- CHATBOT -->
    <section id="chatbot" class="section alt">
        <div class="container">
            <h2 data-i18n="nav.chatbot"></h2>
            <p data-i18n="chatbot.body"></p>

            <div class="iframe-wrapper">
                <iframe
                    src="https://carbaz-career-conversation.hf.space"
                    style="width:100%; height:650px; border:none;"
                ></iframe>
            </div>
        </div>
    </section>

    <!-- CERTIFICATES -->
    <section id="certs" class="section">
        <div class="container">
            <h2 data-i18n="certs.title"></h2>
            <p data-i18n="certs.body"></p>

            <div id="cert-list"></div>
        </div>
    </section>

    <footer>
        <p data-i18n="footer.copy"></p>
    </footer>

    <!-- ========================= -->
    <!--        JAVASCRIPT         -->
    <!-- ========================= -->

    <script src="assets/js/theme-toggle.js"></script>
    <script src="assets/js/locales-loading.js"></script>
    <script src="assets/js/certificates-loading.js"></script>
</body>
</html>
